name: NHTSA TSB Bulk Ingestion

on:
  workflow_dispatch:
    inputs:
      chunks:
        description: "NHTSA chunk range/list (example: 2020-2024)"
        required: true
        default: "2020-2024"
        type: string
      year:
        description: "Optional model year filter (example: 2022)"
        required: false
        default: ""
        type: string
      make:
        description: "Optional make filter (example: HONDA)"
        required: false
        default: ""
        type: string
      model:
        description: "Optional model filter (example: ODYSSEY)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: nhtsa-tsb-bulk-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest NHTSA TSB corpus
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NHTSA_TSB_CHUNKS: ${{ inputs.chunks }}
      NHTSA_TSB_YEAR: ${{ inputs.year }}
      NHTSA_TSB_MAKE: ${{ inputs.make }}
      NHTSA_TSB_MODEL: ${{ inputs.model }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "Missing GitHub Actions secret: SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing GitHub Actions secret: SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Show ingestion scope
        shell: bash
        run: |
          echo "Chunks: $NHTSA_TSB_CHUNKS"
          echo "Year: ${NHTSA_TSB_YEAR:-ALL}"
          echo "Make: ${NHTSA_TSB_MAKE:-ALL}"
          echo "Model: ${NHTSA_TSB_MODEL:-ALL}"

      - name: Run NHTSA TSB bulk ingestion
        run: node scripts/ingest-nhtsa-tsb-bulk.js
