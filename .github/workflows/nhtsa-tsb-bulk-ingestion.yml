name: NHTSA TSB Bulk Ingestion

on:
  workflow_dispatch:
    inputs:
      chunks:
        description: "NHTSA chunk range/list (example: 2005-2009)"
        required: true
        default: "2005-2009"
        type: string

permissions:
  contents: read

concurrency:
  group: nhtsa-tsb-bulk-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest NHTSA TSB corpus
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NHTSA_TSB_CHUNKS: ${{ inputs.chunks }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "Missing GitHub Actions secret: SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing GitHub Actions secret: SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Run NHTSA TSB bulk ingestion
        run: node scripts/ingest-nhtsa-tsb-bulk.js
