name: SKSK ProTech Integration Pipeline

on:
  push:
    branches: [ main, chore/improve-writing ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Node.js Runtime
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Project Dependencies
      run: npm ci || npm install

    - name: Structured Estimate Contract Checks
      run: |
        node --check src/contracts/estimate.ai.contract.js
        node --check src/core/evidence/verified.repair.resolution.js
        node --check src/core/evidence/verified.estimate.snapshot.js
        node --check src/services/ai/providers/gemini.js
        node --check src/routes/estimate.js
        node --check src/routes/invoice.js
        node scripts/test-estimate-contract.js
        node scripts/test-gemini-fallback.js

    - name: Deterministic Guard Regression Checks
      run: npm run test:guards

    - name: Provider Routing Regression Checks
      run: npm run test:providers

    - name: Lifecycle HTTP Regression Checks
      run: npm run test:lifecycle

    - name: Measurement Normalization Regression Checks
      run: npm run test:measurements

    - name: Evidence Retrieval Regression Checks
      run: npm run test:evidence

    - name: Quick Ask Retrieval Boundary Checks
      run: npm run test:quick-ask

    - name: Diagnose Pipeline Contract Checks
      run: npm run test:diagnose-pipeline

    - name: Diagnostic Evidence Packet Checks
      run: npm run test:evidence-packet

    - name: Verified Case Handoff Checks
      run: npm run test:verified-case

    - name: Estimate Verified Truth Checks
      run: npm run test:estimate-verified-truth

    - name: Verified Repair Resolution Checks
      run: npm run test:repair-resolution

    - name: Verified Estimate Invoice Handoff Checks
      run: npm run test:invoice-handoff

    - name: Verified Lifecycle Frontend Checks
      run: npm run test:frontend-lifecycle

    - name: Hardened OpenAPI Contract Lint
      run: npx @stoplight/spectral-cli lint openapi.yaml --ruleset .spectral.yaml --format pretty

    - name: Render PR Runtime Evidence Smoke
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PREVIEW_URL: https://p613-backend-pr-${{ github.event.number }}.onrender.com
      run: |
        git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA" || true
        CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"
        echo "$CHANGED_FILES"

        EVIDENCE_CHANGED=0
        UNVERIFIED_CHANGED=0
        MANUAL_REUSE_CHANGED=0
        TEST_EVIDENCE_CHANGED=0

        if echo "$CHANGED_FILES" | grep -Eq '^(api/server\.js$|src/services/(lemon|lemon\.worker|lemon\.path\.resolver|vehicle\.warmup|vin)\.js$|src/workers/lemonTargetedWorker\.js$|scripts/scrape-lemon-targeted-evidence\.js$|src/core/knowledge/(quick\.ask\.(retriever|bounded)|dtc\.retrieval\.intent)\.js$|src/routes/(quick\.ask|vehicle)\.js$)'; then
          EVIDENCE_CHANGED=1
        fi

        if echo "$CHANGED_FILES" | grep -Eq '^(src/db\.js$|src/services/manual\.evidence\.reuse\.js$)'; then
          EVIDENCE_CHANGED=1
          MANUAL_REUSE_CHANGED=1
        fi

        if echo "$CHANGED_FILES" | grep -Eq '^(api/server\.js$|public/lifecycle\.html$|src/services/job\.lifecycle\.js$|src/core/evidence/unverified\.diagnosis\.js$|src/routes/(jobs|jobs\.protected)\.js$)'; then
          UNVERIFIED_CHANGED=1
        fi

        if echo "$CHANGED_FILES" | grep -Eq '^(src/services/job\.lifecycle\.js$|src/routes/jobs\.protected\.js$)'; then
          TEST_EVIDENCE_CHANGED=1
        fi

        echo "Runtime canaries: evidence=$EVIDENCE_CHANGED manualReuse=$MANUAL_REUSE_CHANGED unverified=$UNVERIFIED_CHANGED testEvidence=$TEST_EVIDENCE_CHANGED"

        if [ "$EVIDENCE_CHANGED" != "1" ] && [ "$UNVERIFIED_CHANGED" != "1" ]; then
          echo "No affected runtime canary lane; Render preview smoke skipped."
          exit 0
        fi

        echo "Waiting for exact Render preview head $HEAD_SHA at $PREVIEW_URL"
        MATCHED=0
        REACHABLE=0
        for attempt in $(seq 1 36); do
          HTTP_CODE="$(curl --connect-timeout 5 --max-time 10 -sS -o /tmp/render-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
          if [ "$HTTP_CODE" = "200" ]; then
            REACHABLE=1
            if HEAD_SHA="$HEAD_SHA" node - <<'NODE'
        const fs = require('fs');
        const health = JSON.parse(fs.readFileSync('/tmp/render-health.json', 'utf8'));
        if (health?.preview?.commit === process.env.HEAD_SHA) process.exit(0);
        process.exit(1);
        NODE
            then
              MATCHED=1
              break
            fi
          fi
          echo "Preview not on exact head yet (attempt $attempt/36, HTTP $HTTP_CODE)."
          sleep 5
        done

        if [ "$MATCHED" != "1" ]; then
          if [ "$REACHABLE" != "1" ]; then
            echo "::warning::Render PR preview is unavailable at $PREVIEW_URL; runtime smoke skipped. Repository tests and lint passed independently of preview infrastructure."
            cat /tmp/render-health.json 2>/dev/null || true
            exit 0
          fi

          echo "Render preview was reachable but never reached exact PR head $HEAD_SHA."
          cat /tmp/render-health.json 2>/dev/null || true
          exit 1
        fi

        if [ "$EVIDENCE_CHANGED" = "1" ]; then
          SMOKE_URL="$PREVIEW_URL/health/preview-evidence?vin=5XXGT4L38LG384941&query=P1326%20knock%20signal%20range%20performance%20flashing%20MIL%20reduced%20power"
          HTTP_CODE="$(curl --connect-timeout 5 --max-time 45 -sS -o /tmp/render-evidence-smoke.json -w '%{http_code}' "$SMOKE_URL" || true)"
          cat /tmp/render-evidence-smoke.json || true
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Render preview evidence smoke failed with HTTP $HTTP_CODE."
            exit 1
          fi

          HEAD_SHA="$HEAD_SHA" node - <<'NODE'
        const fs = require('fs');
        const smoke = JSON.parse(fs.readFileSync('/tmp/render-evidence-smoke.json', 'utf8'));
        const failures = [];
        if (smoke.ok !== true) failures.push('smoke.ok !== true');
        if (smoke.runtime?.commit !== process.env.HEAD_SHA) failures.push('runtime commit mismatch');
        if (smoke.decode?.statusCode !== 200) failures.push(`decode HTTP ${smoke.decode?.statusCode}`);
        if (smoke.quickAsk?.statusCode !== 200) failures.push(`Quick Ask HTTP ${smoke.quickAsk?.statusCode}`);
        if (smoke.quickAsk?.status !== 'SUCCESS') failures.push(`Quick Ask status ${smoke.quickAsk?.status}`);
        if (Number(smoke.quickAsk?.ms || Infinity) > 40000) failures.push(`Quick Ask latency ${smoke.quickAsk?.ms}ms exceeded 40000ms ceiling`);
        const titles = Array.isArray(smoke.quickAsk?.referenceTitles) ? smoke.quickAsk.referenceTitles : [];
        if (titles.some(title => /(?:^|\D)1\.6\s*L\b/i.test(String(title)))) failures.push('known 2.4L Optima surfaced explicit 1.6L manual reference');
        const warnings = Array.isArray(smoke.quickAsk?.warnings) ? smoke.quickAsk.warnings : [];
        if (!warnings.some(w => /DTC-anchored retrieval active for P1326/i.test(String(w)))) failures.push('P1326 runtime did not enter DTC-anchored retrieval');
        if (failures.length) {
          console.error(failures.join('; '));
          process.exit(1);
        }
        console.log(`Render evidence smoke passed: decode=${smoke.decode.ms}ms quickAsk=${smoke.quickAsk.ms}ms total=${smoke.totalMs}ms refs=${smoke.quickAsk.repairDiagnosisReferenceCount}`);
        NODE

          if [ "$MANUAL_REUSE_CHANGED" = "1" ]; then
            REUSE_URL="$PREVIEW_URL/health/preview-evidence?vin=KNDJC736385765089&query=P0300%20P0171%20random%20misfire%20lean%20bank%201%20deceleration%20full%20lock%20clunk"
            HTTP_CODE="$(curl --connect-timeout 5 --max-time 45 -sS -o /tmp/render-manual-reuse-smoke.json -w '%{http_code}' "$REUSE_URL" || true)"
            cat /tmp/render-manual-reuse-smoke.json || true
            echo

            if [ "$HTTP_CODE" != "200" ]; then
              echo "Render manual-reuse smoke failed with HTTP $HTTP_CODE."
              exit 1
            fi

            HEAD_SHA="$HEAD_SHA" node - <<'NODE'
        const fs = require('fs');
        const smoke = JSON.parse(fs.readFileSync('/tmp/render-manual-reuse-smoke.json', 'utf8'));
        const failures = [];
        const manual = smoke.quickAsk?.retrievalTelemetry?.manual || {};
        if (smoke.ok !== true) failures.push('reuse smoke.ok !== true');
        if (smoke.runtime?.commit !== process.env.HEAD_SHA) failures.push('reuse runtime commit mismatch');
        if (smoke.decode?.statusCode !== 200) failures.push(`reuse decode HTTP ${smoke.decode?.statusCode}`);
        if (!/sorento/i.test(String(smoke.decode?.vehicle?.model || ''))) failures.push(`reuse decoded model ${smoke.decode?.vehicle?.model}`);
        if (smoke.quickAsk?.statusCode !== 200 || smoke.quickAsk?.status !== 'SUCCESS') failures.push('reuse Quick Ask did not succeed');
        if (manual.timedOut === true) failures.push('reuse manual retrieval timed out');
        if (smoke.quickAsk?.repairDiagnosisFromCache !== true) failures.push('reuse manual evidence did not come from stored cache');
        if (Number(manual.elapsedMs || Infinity) > 5000) failures.push(`reuse manual latency ${manual.elapsedMs}ms exceeded 5000ms target`);
        if (Number(smoke.quickAsk?.repairDiagnosisReferenceCount || 0) < 1) failures.push('reuse produced no focused manual references');
        const warnings = Array.isArray(smoke.quickAsk?.warnings) ? smoke.quickAsk.warnings : [];
        if (!warnings.some(w => /DTC-anchored retrieval active for P0300, P0171/i.test(String(w)))) failures.push('reuse runtime did not keep P0300/P0171 DTC anchors');
        if (failures.length) {
          console.error(failures.join('; '));
          process.exit(1);
        }
        console.log(`Render manual reuse passed: manual=${manual.elapsedMs}ms total=${smoke.quickAsk.ms}ms refs=${smoke.quickAsk.repairDiagnosisReferenceCount} fromCache=${smoke.quickAsk.repairDiagnosisFromCache}`);
        NODE
          fi
        else
          echo "Evidence/Quick Ask hot path unchanged; evidence canary skipped."
        fi

        if [ "$UNVERIFIED_CHANGED" = "1" ]; then
          UNVERIFIED_URL="$PREVIEW_URL/health/preview-unverified-diagnosis"
          HTTP_CODE="$(curl --connect-timeout 5 --max-time 20 -sS -o /tmp/render-unverified-smoke.json -w '%{http_code}' "$UNVERIFIED_URL" || true)"
          cat /tmp/render-unverified-smoke.json || true
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Render preview unverified diagnosis smoke failed with HTTP $HTTP_CODE."
            exit 1
          fi

          HEAD_SHA="$HEAD_SHA" node - <<'NODE'
        const fs = require('fs');
        const smoke = JSON.parse(fs.readFileSync('/tmp/render-unverified-smoke.json', 'utf8'));
        const failures = [];
        if (smoke.ok !== true) failures.push('unverified smoke.ok !== true');
        if (smoke.runtime?.commit !== process.env.HEAD_SHA) failures.push('unverified runtime commit mismatch');
        if (smoke.fallback?.statusCode !== 200) failures.push(`fallback HTTP ${smoke.fallback?.statusCode}`);
        if (smoke.fallback?.diagnosisState !== 'UNVERIFIED_DIAGNOSIS') failures.push(`fallback state ${smoke.fallback?.diagnosisState}`);
        if (smoke.fallback?.physicallyVerified !== false) failures.push('fallback physicallyVerified must be false');
        if (smoke.fallback?.repairAuthorized !== false) failures.push('fallback repairAuthorized must be false');
        if (smoke.fallback?.estimateReady !== false) failures.push('fallback estimateReady must be false');
        if (smoke.persisted?.status !== 'TESTING') failures.push(`persisted status ${smoke.persisted?.status}`);
        if (smoke.persisted?.hasVerifiedCase !== false) failures.push('fallback unexpectedly created VERIFIED_CASE');
        if (smoke.estimateBypassAttempt?.statusCode !== 409) failures.push(`estimate bypass HTTP ${smoke.estimateBypassAttempt?.statusCode}`);
        if (smoke.ui?.hasFallback !== true) failures.push('rendered lifecycle page missing fallback UI');
        if (failures.length) {
          console.error(failures.join('; '));
          process.exit(1);
        }
        console.log(`Unverified diagnosis runtime smoke passed: fallback=${smoke.fallback.ms}ms state=${smoke.fallback.diagnosisState} estimateBypass=${smoke.estimateBypassAttempt.statusCode} UI=${smoke.ui.hasFallback}`);
        NODE

          if [ "$TEST_EVIDENCE_CHANGED" = "1" ]; then
            JOB_ID="$(node - <<'NODE'
        const fs = require('fs');
        const smoke = JSON.parse(fs.readFileSync('/tmp/render-unverified-smoke.json', 'utf8'));
        if (!smoke.jobId) process.exit(1);
        process.stdout.write(smoke.jobId);
        NODE
        )"
            ENCODED_JOB_ID="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$JOB_ID")"
            echo "Verification-evidence runtime job: $JOB_ID"

            for PLACEHOLDER in '(unknown)' '“unknown.”' 'unknown…'; do
              BODY="$(PLACEHOLDER="$PLACEHOLDER" node -e 'process.stdout.write(JSON.stringify({name:"Runtime placeholder evidence",result:process.env.PLACEHOLDER}))')"
              HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/render-placeholder-test.json -w '%{http_code}' \
                -X POST -H 'Content-Type: application/json' --data "$BODY" \
                "$PREVIEW_URL/api/jobs/$ENCODED_JOB_ID/tests" || true)"
              cat /tmp/render-placeholder-test.json || true
              echo
              if [ "$HTTP_CODE" != "409" ]; then
                echo "Punctuated placeholder ${PLACEHOLDER} was not rejected; HTTP $HTTP_CODE."
                exit 1
              fi
            done

            HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/render-verify-no-evidence.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' \
              --data '{"confirmed":true,"confirmedCause":"Knock sensor circuit signal fault","conclusion":"Runtime verification must bind persisted evidence.","evidenceTestIds":["missing-test"]}' \
              "$PREVIEW_URL/api/jobs/$ENCODED_JOB_ID/verify" || true)"
            cat /tmp/render-verify-no-evidence.json || true
            echo
            if [ "$HTTP_CODE" != "409" ]; then
              echo "VERIFY without persisted evidence was not rejected; HTTP $HTTP_CODE."
              exit 1
            fi

            HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/render-valid-test.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' \
              --data '{"name":"Inspect knock sensor connector","result":"Connector dry; no corrosion observed."}' \
              "$PREVIEW_URL/api/jobs/$ENCODED_JOB_ID/tests" || true)"
            cat /tmp/render-valid-test.json || true
            echo
            if [ "$HTTP_CODE" != "201" ]; then
              echo "Descriptive observation was not accepted; HTTP $HTTP_CODE."
              exit 1
            fi

            TEST_ID="$(node - <<'NODE'
        const fs = require('fs');
        const body = JSON.parse(fs.readFileSync('/tmp/render-valid-test.json', 'utf8'));
        if (!body.test?.id) process.exit(1);
        process.stdout.write(body.test.id);
        NODE
        )"

            TEST_ID="$TEST_ID" node - <<'NODE'
        const fs = require('fs');
        fs.writeFileSync('/tmp/render-valid-verify-body.json', JSON.stringify({
          confirmed: true,
          confirmedCause: 'Knock sensor circuit signal fault',
          conclusion: 'Connector inspection was recorded as a real mechanic observation for the runtime verification path.',
          evidenceTestIds: [process.env.TEST_ID]
        }));
        NODE

            HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/render-valid-verify.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' --data-binary @/tmp/render-valid-verify-body.json \
              "$PREVIEW_URL/api/jobs/$ENCODED_JOB_ID/verify" || true)"
            cat /tmp/render-valid-verify.json || true
            echo
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Normal VERIFY path failed with HTTP $HTTP_CODE."
              exit 1
            fi

            TEST_ID="$TEST_ID" node - <<'NODE'
        const fs = require('fs');
        const body = JSON.parse(fs.readFileSync('/tmp/render-valid-verify.json', 'utf8'));
        const failures = [];
        if (body.status !== 'VERIFIED') failures.push(`status ${body.status}`);
        if (body.estimateReady !== true) failures.push('estimateReady !== true');
        if (!body.verifiedCase) failures.push('VERIFIED_CASE missing');
        if (!Array.isArray(body.verification?.evidenceTestIds) || !body.verification.evidenceTestIds.includes(process.env.TEST_ID)) {
          failures.push('selected test not bound to verification');
        }
        if (failures.length) {
          console.error(failures.join('; '));
          process.exit(1);
        }
        console.log(`Verification-evidence runtime smoke passed: placeholders=409, missing-evidence verify=409, valid test=201, verify=200 VERIFIED, test=${process.env.TEST_ID}`);
        NODE
          fi
        else
          echo "Unverified-diagnosis/lifecycle hot path unchanged; unverified canary skipped."
        fi
