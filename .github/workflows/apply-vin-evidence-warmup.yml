name: Apply VIN evidence warmup

on:
  push:
    branches: [ feature/vin-evidence-warmup ]

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vin-evidence-warmup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Apply patch
        run: node scripts/apply-vin-evidence-warmup.js

      - name: Syntax check
        run: |
          node --check src/services/vehicle.warmup.js
          node --check src/routes/vehicle.js
          node --check src/services/vehicle.evidence.js
          node --check src/routes/estimate.js
          node --check src/routes/diagnose.js
          node --check api/server.js

      - name: Regression checks
        run: |
          node scripts/test-evidence-selection.js
          node scripts/test-vehicle-profile-merge.js
          node scripts/test-completed-work-guard.js

      - name: Remove one-shot patch infrastructure
        run: |
          rm scripts/apply-vin-evidence-warmup.js
          rm .github/workflows/apply-vin-evidence-warmup.yml

      - name: Commit patched implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Warm vehicle evidence on VIN decode" || exit 0
          git push origin HEAD:feature/vin-evidence-warmup
