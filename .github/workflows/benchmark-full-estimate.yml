name: SKSK Full Estimate 10-Run Benchmark

on:
  push:
    branches:
      - feature/bench-full-estimate-10
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run 10 full lifecycle estimates sequentially
        env:
          API_BASE: https://p613-backend.onrender.com
          RUNS: '10'
          REQUEST_TIMEOUT_MS: '90000'
        run: npm run bench:full-estimate
