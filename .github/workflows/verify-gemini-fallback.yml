name: Verify Gemini fallback

on:
  push:
    branches: [ feature/gemini-provider-fallback ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci || npm install
      - name: Syntax checks
        run: |
          node --check src/services/ai/providers/gemini.js
          node --check src/services/ai/providerRouter.js
          node --check src/services/groq.js
      - name: Regression checks
        run: |
          node scripts/test-gemini-fallback.js
          node scripts/test-completed-work-guard.js
